# Baut das Spiel und veröffentlicht es als Website auf GitHub Pages.
# Einmalig nötig: Im Repository unter Settings → Pages → „Build and deployment“ die Quelle „GitHub Actions“ wählen.
name: Website veröffentlichen

on:
  push:
    branches: [main, claude/racing-game-tycoon-gameplay-rrfa2h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
